name: TP Todo CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Build app
        run: npm run build

  browser-load-test:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup k6
        uses: grafana/setup-k6-action@v1
        with:
          browser: true

      - name: Install dependencies
        run: npm ci

      - name: Start Vite
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:5173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vite.log
          exit 1

      - name: Run Chromium browser load test
        env:
          K6_BROWSER_ENABLED: 'true'
          K6_BROWSER_HEADLESS: 'true'
          BASE_URL: http://127.0.0.1:5173
        run: npm run test:browser:load
